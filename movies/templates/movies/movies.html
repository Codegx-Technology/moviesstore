{% extends 'base.html' %}
{% load static %}

{% block content %}

<h1 class="text-center mt-4">List of Movies</h1>
<hr/>

<div class="container mt-4">
    <div class="row justify-content-center">
        {% for movie in template_data.movies %}
        <div class="col-md-4 col-sm-6 mb-4">
            <div class="card shadow-sm h-100 text-center">
                <img src="{% static 'images/about.jpg' %}" class="card-img-top" alt="Movie Image">
                <div class="card-body">
                    <h5 class="card-title">{{ movie.name }}</h5>
                    <p class="card-text">{{ movie.description }}</p>
                    <p class="card-text text-success fw-bold">${{ movie.price }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock content %}
